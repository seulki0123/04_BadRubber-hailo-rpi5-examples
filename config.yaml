id: "SSBR_work-A"

detect:
  weight: "resources/weights/SSBR_split-6/weights/yolov8n.hef"
  classes:
    0: "rubber"
  score_threshold: 0.9

ipcamera:
  url1: "rtsp://admin:dlsvmfk2849%40@192.168.20.23:554/Streaming/Channels/101"
  url2: null
  width: 640
  height: 360
  fps: 25
  format: "RGB"
  thread_interval: 0.03

gates:
  mask_root: "masks/SSBR"
  names:
    in1: split_in
    in2: null
    out1: split_out_a
    out2: split_out_b

idmanager:
  client:
    host: "127.0.0.1"
    port: 5000
  server:
    host: "127.0.0.1"
    port: 5001
  thread_interval: 0.03

drawer:
  draw: True
  record: True
  
log_dir:
  root: "logs"
  temp: "temp"

thread:
  min_interval: 0.001
  join_timeout: 2.0

detection_queue:
  max_size: 300
  logging_interval: 3
  get_timeout: 0.01

post_processor:
  thread_interval: 0

recorder:
  save_root: "results"
  save_frames: True

tracker:
  iou_threshold: 0.01
  old_threshold: 3
  scale_w: 1
  scale_h: 1