id: "SSBR_split"

detect:
  weight: "resources/SSBR_split-6/weights/yolov8n.hef"
  classes:
    0: "rubber"
  score_threshold: 0.9

ipcamera:
  url1: "rtsp://admin:dlsvmfk2849%40@192.168.20.23:554/Streaming/Channels/101"
  url2: null
  width: 640
  height: 360
  fps: 25
  format: "RGB"
  thread_interval: 0.00

gates:
  default_active: False
  mask_root: "masks/SSBR"
  names:
    in1: split_in
    in2: null
    out1: split_out_a
    out2: split_out_b
  map:
    inspection_out: split_in
    split_out_a: work_in_a
    split_out_b: work_in_b
    work_out_a: merge_in_a
    work_out_b: merge_in_b

post_processor:
  thread_interval: 0
  exit_event_when_removed: False # default: True, False when SSBR split

idmanager:
  thread_interval: 0.00

network:
  listener:
    host: "192.168.20.10"
    port: 5000
  notifier:
    host: "192.168.20.10"
    port: 5000
  local:
    host: "192.168.20.12"
    port: 5000
    
drawer:
  draw: False
  record: False

recorder:
  save_root: "results"
  save_frames: False

log_dir:
  root: "logs"
  temp: "temp"

thread:
  min_interval: 0.001
  join_timeout: 2.0

detection_queue:
  max_size: 300
  logging_interval: 3
  get_timeout: 0.01

tracker:
  iou_threshold: 0.01
  old_threshold: 3
  scale_w: 1
  scale_h: 1