detect:
  classes:
    0: "rubber"
  weight: ~
  score_threshold: ~

classifier:
  model_path: ~
  class_names: ["1", "2", "A"]

ipcamera:
  width: 640
  height: 360
  fps: 25
  format: "RGB"
  thread_interval: 0.00
  url1: ~
  url2: ~
  blocked: ~

stream:
  capture_dir: "results/captures"
  exit_event_when_removed: True
  weigher_delay: 0
  weigher_speed_threshold: 80 # pixels per second

gates:
  mask_root: "masks/SSBR"
  inputs: []
  outputs: [] 
  weighers: []
  map:
    imagedb_out:  branch_in
    branch_out_a: house_in_a
    branch_out_b: house_in_b
    inspector_out_a: join_in_a
    inspector_out_b: join_in_b
    weigher_a: {'in': 'weigher_in_a', 'out': 'weigher_out_a'}
    weigher_b: {'in': 'weigher_in_b', 'out': 'weigher_out_b'}
  active_file: "gate_active.yaml"

stream_queue:
  active_file: "stream_active.yaml"

post_processor:
  thread_interval: 0
  containment_threshold: 0.8

idmanager:
  thread_interval: 0.00

recorder:
  save_root: "results"
  draw: ~
  record: ~
  save_frames: ~
  update_interval: 1

log_dir:
  root: "logs"
  temp: "temp"

network:
  listener: { host: ~, port: ~ }
  notifier: { host: ~, port: ~ }
  local: { host: ~, port: ~ }

thread:
  min_interval: 0.001
  join_timeout: 2.0

detection_queue:
  max_size: 300
  logging_interval: 3
  get_timeout: 0.01

tracker:
  iou_threshold: 0.1
  old_threshold: 10
  scale_w: 1
  scale_h: 1

valid_time:
  enabled: ~

  branch_in: { threshold: ~, error_margin: ~ }

  house_in_a: { threshold: ~, error_margin: ~ }
  house_in_b: { threshold: ~, error_margin: ~ }

  join_in_a: { threshold: ~, error_margin: ~ }
  join_in_b: { threshold: ~, error_margin: ~ }