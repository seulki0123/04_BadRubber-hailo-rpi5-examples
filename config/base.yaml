detect:
  classes:
    0: "rubber"
  weight: ~
  score_threshold: ~

classifier:
  imgsz: 448
  model_path: ~
  class_names: ~
  buffer_size: 100
  cls_limit: 20
  conf_threshold: 0.95

bbox_capture:
  wr: 1.0
  hr: 1.0
  save: False
  save_dir: "results/captures"

ipcamera:
  width: 640
  height: 360
  fps: 25
  format: "RGB"
  thread_interval: 0.00
  url1: ~
  url2: ~
  blocked: ~
  blank: 0

stream:
  exit_event_when_removed: True
  weigher_delay: 0
  weigher_speed_threshold_max: 80 # pixels per second
  weigher_speed_threshold_min: 10 # pixels per second
  weigher_must_finalized: False

gates:
  mask_root: ~
  inputs: []
  input_blocks: []
  outputs: [] 
  weighers: []
  classify: []
  map:
    imagedb_out:  branch_in
    branch_out_a: house_in_a
    branch_out_b: house_in_b
    inspector_out_a: join_in_a
    inspector_out_b: join_in_b
    weigher_a: {'in': 'weigher_in_a', 'out': 'weigher_out_a'}
    weigher_b: {'in': 'weigher_in_b', 'out': 'weigher_out_b'}
  active_file: "gate_active.yaml"

stream_queue:
  active_file: "stream_active.yaml"
  just_one_id_zones: [] # ["branch_in"]

post_processor:
  thread_interval: 0
  containment_threshold: 0.8

idmanager:
  device_fallback_id: ~
  create_retry_delay: ~
  thread_interval: 0.00

recorder:
  save_root: "results"
  draw: ~
  record: ~
  save_frames: ~
  update_interval: 1

log_dir:
  root: "logs"
  process: "process"
  monitor: "monitor"

network:
  notifier: { host: ~, port: ~ }
  listener: []
  local: { host: ~, port: ~ }

thread:
  min_interval: 0.001
  join_timeout: 2.0

detection_queue:
  max_size: 300
  logging_interval: 3
  get_timeout: 0.01

tracker:
  iou_threshold: 0.1
  old_threshold: 10
  scale_w: 1
  scale_h: 1
  age_threshold: 15
  area_threshold: ~

valid_time:
  branch_in: { min_create_seconds: ~, max_create_seconds: ~ }

  house_in_a: { min_create_seconds: ~, max_create_seconds: ~ }
  house_in_b: { min_create_seconds: ~, max_create_seconds: ~ }

  join_in_a: { min_create_seconds: ~, max_create_seconds: ~ }
  join_in_b: { min_create_seconds: ~, max_create_seconds: ~ }

baler:
  unsynced_baler: 11
  create_fallback_baler_no_externals: 10 # not created from external
  classify_fallback_baler: ~ # 12, used only BR-B
  create_fallback_baler_not_input_zone: 13

sync:
  time:
    branch_in:
      enabled: False
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: 2
      mismatch: 1
      min_external_interval: ~ # seconds; suspend sync if external time diff < this
      external_event_type: ~ # "id_added_imagedb_out"
      internal_event_type: ~ # "created_branch_in"
      active_target_zone: ~ # ["branch_in"]
    join_in_a:
      enabled: False
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: 5
      mismatch: 1
      external_event_type: ~ # "id_added_inspector_out_a"
      internal_event_type: ~ # "created_join_in_a"
      active_target_zone: ~ # ["join_in_a"]
      min_external_interval: ~ # seconds; suspend sync if external time diff < this
    join_in_b:
      enabled: False
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: 5
      mismatch: 1
      external_event_type: ~ # "id_added_inspector_out_b"
      internal_event_type: ~ # "created_join_in_b"
      active_target_zone: ~ # ["join_in_b"]
      min_external_interval: ~ # seconds; suspend sync if external time diff < this

  baler:
    a:
      enabled: False
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: ~
      mismatch: 1
      external_event_type: ~ # "id_added_branch_out_a"
      internal_event_type: ~ # "final_baler_house_in_a"
      active_target_zone: ~ # ["weigher_in_a"]
    b:
      enabled: False
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: ~
      mismatch: 1
      external_event_type: ~ # "id_added_branch_out_b"
      internal_event_type: ~ # "final_baler_house_in_b"
      active_target_zone: ~ # ["weigher_in_b"]

resource_monitor:
  thread_interval: 3
  cpu_interval: 0.5
  cpu_threshold: 80 # %
  ram_threshold: 80 # %
  disk_threshold: 80 # %

voltage_monitor:
  logging_interval: 3
  thread_interval: 0.01
  max_queue_size: 300

# ============================================================
# Log Cleaner (오래된 로그 파일 자동 삭제)
# ------------------------------------------------------------
# log_dir.root 하위의 target_dirs 를 스캔해, mtime 이 retention_days 일보다
# 오래된 파일을 file_extensions 화이트리스트 조건에서만 삭제한다.
# - 스캔 범위는 항상 log_dir.root 로 제한 (임의 경로 접근 차단)
# - 심볼릭 링크는 따라가지 않음
# - dry_run=true 로 먼저 검증 후 false 로 전환 권장
# ============================================================
log_cleaner:
  enabled: true               # 기본 활성화 (log_dir.root 하위만 동작하므로 안전)
  retention_days: 30          # 30일보다 오래된 파일 삭제
  thread_interval: 3600       # 1시간마다 점검 (초)
  target_dirs:                # log_dir.root 하위의 하위 폴더명
    - "process"
    - "monitor"
  file_extensions:            # 삭제 허용 확장자 (TimedRotatingFileHandler 의 rotated 파일 포함)
    - ".log"
  dry_run: false              # true 면 실제 삭제 없이 "삭제 예정" 로그만 남김
 
# ============================================================
# Event Image Saver (이벤트별 이미지 저장)
# ------------------------------------------------------------
# 각 트래킹 이벤트(weigher_in, weigher_out, final_baler, removed, exited 등)
# 발생 시 현재 프레임을 results/event_images/ 아래에 이미지로 저장한다.
#
# 기본값: enabled=false. 실제 운영에서 필요할 때 프로파일에서 true로 오버라이드하거나
# 이 파일을 직접 true로 바꿔서 활성화한다.
# ============================================================
event_image_saver:
  enabled: false                    # 기본 비활성 (안전 우선)
  save_dir: "results/event_images"  # 저장 루트 (프로젝트 루트 상대)
  draw_bbox: true                   # bbox + 라벨 주석 포함
  draw_all_tracks: true             # 모든 활성 트랙 표시 (연회색)
  organize_by_event_type: true      # 이벤트 타입별 하위 폴더
  queue_size: 500                   # 비동기 저장 큐 크기
  jpeg_quality: 90                  # JPEG 품질 (1~100)
  # enabled_event_prefixes: null 이면 모든 이벤트 저장.
  # 특정 이벤트만 저장하려면 리스트로 지정 (prefix 매칭):
  # enabled_event_prefixes:
  #   - "weigher_in"
  #   - "weigher_out"
  #   - "final_baler"
  #   - "removed"
  enabled_event_prefixes: ~
