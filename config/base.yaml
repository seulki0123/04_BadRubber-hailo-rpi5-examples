detect:
  classes:
    0: "rubber"
  weight: ~
  score_threshold: ~

classifier:
  imgsz: 448
  model_path: ~
  class_names: ~
  buffer_size: 100
  cls_limit: 20
  conf_threshold: 0.95

bbox_capture:
  wr: 1.0
  hr: 1.0
  save: False
  save_dir: "results/captures"

ipcamera:
  width: 640
  height: 360
  fps: 25
  format: "RGB"
  thread_interval: 0.00
  url1: ~
  url2: ~
  blocked: ~

stream:
  exit_event_when_removed: True
  weigher_delay: 0
  weigher_speed_threshold_max: 50 # pixels per second
  weigher_speed_threshold_min: 1 # pixels per second

gates:
  mask_root: ~
  inputs: []
  outputs: [] 
  weighers: []
  classify: []
  map:
    imagedb_out:  branch_in
    branch_out_a: house_in_a
    branch_out_b: house_in_b
    inspector_out_a: join_in_a
    inspector_out_b: join_in_b
    weigher_a: {'in': 'weigher_in_a', 'out': 'weigher_out_a'}
    weigher_b: {'in': 'weigher_in_b', 'out': 'weigher_out_b'}
  active_file: "gate_active.yaml"

stream_queue:
  active_file: "stream_active.yaml"

post_processor:
  thread_interval: 0
  containment_threshold: 0.8

idmanager:
  thread_interval: 0.00

recorder:
  save_root: "results"
  draw: ~
  record: ~
  save_frames: ~
  update_interval: 1

log_dir:
  root: "logs"
  process: "process"
  monitor: "monitor"

network:
  listener: { host: ~, port: ~ }
  notifier: { host: ~, port: ~ }
  local: { host: ~, port: ~ }

thread:
  min_interval: 0.001
  join_timeout: 2.0

detection_queue:
  max_size: 300
  logging_interval: 3
  get_timeout: 0.01

tracker:
  iou_threshold: 0.1
  old_threshold: 10
  scale_w: 1
  scale_h: 1

valid_time:
  enabled: ~

  branch_in: { threshold: ~, error_margin: ~ }

  house_in_a: { threshold: ~, error_margin: ~ }
  house_in_b: { threshold: ~, error_margin: ~ }

  join_in_a: { threshold: ~, error_margin: ~ }
  join_in_b: { threshold: ~, error_margin: ~ }

baler:
  unsynced_baler: 11
  fallback_baler: 10 # not created from external
  classify_fallback_baler: ~

sync:
  time:
    enabled: False
    max_queue_size: 10
    valid_queue_size: 5
    external_event_type: ~ # "id_added_imagedb_out"
    internal_event_type: ~ # "created_branch_in"
    tolerance: 1.2
    active_target_zone: ~ # ["branch_in"]
  
  baler:
    enabled: False
    max_queue_size: 10
    valid_queue_size: 5
    tolerance: ~
    a:
      external_event_type: ~ # "id_added_branch_out_a"
      internal_event_type: ~ # "final_baler_house_in_a"
      active_target_zone: ~ # ["weigher_in_a"]
    b:
      external_event_type: ~ # "id_added_branch_out_b"
      internal_event_type: ~ # "final_baler_house_in_b"
      active_target_zone: ~ # ["weigher_in_b"]

resource_monitor:
  thread_interval: 3
  cpu_interval: 0.5
  cpu_threshold: 80 # %
  ram_threshold: 80 # %
  disk_threshold: 80 # %

voltage_monitor:
  logging_interval: 3
  thread_interval: 0.01
  max_queue_size: 300