camera_id: ~

detect:
  classes:
    0: "rubber"
  weight: ~
  score_threshold: ~

classifier:
  imgsz: 448
  model_path: ~
  class_names: ~
  buffer_size: 100
  cls_limit: 20
  conf_threshold: 0.95

bbox_capture:
  wr: 1.0
  hr: 1.0
  save: False
  save_dir: "results/captures"

ipcamera:
  width: 640
  height: 360
  fps: 25
  format: "RGB"
  thread_interval: 0.00
  url1: ~
  url2: ~
  blocked: ~
  blank: 0

stream:
  exit_event_when_removed: True
  weigher_delay: 0
  weigher_speed_threshold_max: 80 # pixels per second
  weigher_speed_threshold_min: 10 # pixels per second
  weigher_must_finalized: False

gates:
  mask_root: ~
  inputs: []
  input_blocks: []
  outputs: [] 
  weighers: []
  classify: []
  map:
    imagedb_out:  branch_in
    branch_out_a: house_in_a
    branch_out_b: house_in_b
    inspector_out_a: join_in_a
    inspector_out_b: join_in_b
    weigher_a: {'in': 'weigher_in_a', 'out': 'weigher_out_a'}
    weigher_b: {'in': 'weigher_in_b', 'out': 'weigher_out_b'}
  active_file: "gate_active.yaml"

stream_queue:
  max_size:
    branch_in: 30
    house_in_a: 30
    house_in_b: 30
    join_in_a: 30
    join_in_b: 30
  active_file: "stream_active.yaml"

post_processor:
  thread_interval: 0
  containment_threshold: 0.8

idmanager:
  device_fallback_id: ~
  create_retry_delay: ~
  thread_interval: 0.00

recorder:
  save_root: "results/recordings"
  draw: ~
  record: ~
  save_frames: ~
  update_interval: 1
  max_record_seconds: 900 # 15 minutes

log_dir:
  root: "logs"
  process: "process"
  monitor: "monitor"

network:
  client: []
  #   - bind: "192.168.20.11"   # 내 측 source IP (누락 시 OS 자동 선택)
  #     host: "192.168.20.10"   # 피어 IP
  #     port: 5000
  #     notify: { enabled: true,  types: ["track_event_movement", "track_event_count"] }
  #     listen: { enabled: true,  types: ["track_event_count_reset"] }
  server:   { bind: ~, port: ~, types: [] }

event:
  id_added:    { symbol: "□□□□", data_type: ~    }
  created:     { symbol: "□■■■", data_type: "track_event_movement"  }
  weigher_in:  { symbol: "■□■■", data_type: "track_event_movement"  }
  weigher_out: { symbol: "■■□■", data_type: "track_event_movement"  }
  final_baler: { symbol: "■□□■", data_type: ~  }
  exited:      { symbol: "■■■□", data_type: "track_event_movement"  }
  removed:     { symbol: "■■■■", data_type: "track_event_movement"  }

thread:
  min_interval: 0.001
  join_timeout: 2.0

detection_queue:
  max_size: 300
  logging_interval: 3
  get_timeout: 0.01

tracker:
  iou_threshold: 0.1
  old_threshold: 10
  scale_w: 1
  scale_h: 1
  age_threshold: 15
  area_threshold: ~

valid_time:
  branch_in:
    enabled: false
    dynamic: { enabled: false, min_sample_count: 3, max_sample_count: 30 }
    min_create_seconds: ~
    max_create_seconds: ~
    margin_seconds: # fixed
      FIFO:  {lower: 0.0, upper: 0.0}
      VALID: {lower: 0.0, upper: 0.0}
  house_in_a:
    enabled: false
    dynamic: { enabled: false, min_sample_count: 3, max_sample_count: 30 }
    min_create_seconds: ~
    max_create_seconds: ~
    margin_seconds: # fixed
      FIFO:  {lower: 0.0, upper: 0.0}
      VALID: {lower: 0.0, upper: 0.0}

  house_in_b:
    enabled: false
    dynamic: { enabled: false, min_sample_count: 3, max_sample_count: 30 }
    min_create_seconds: ~
    max_create_seconds: ~
    margin_seconds: # fixed
      FIFO:  {lower: 0.0, upper: 0.0}
      VALID: {lower: 0.0, upper: 0.0}

  join_in_a:
    enabled: false
    dynamic: { enabled: false, min_sample_count: 3, max_sample_count: 30 }
    min_create_seconds: ~
    max_create_seconds: ~
    margin_seconds: # fixed
      FIFO:  {lower: 0.0, upper: 0.0}
      VALID: {lower: 0.0, upper: 0.0}
  join_in_b:
    enabled: false
    dynamic: { enabled: false, min_sample_count: 3, max_sample_count: 30 }
    min_create_seconds: ~
    max_create_seconds: ~
    margin_seconds: # fixed
      FIFO:  {lower: 0.0, upper: 0.0}
      VALID: {lower: 0.0, upper: 0.0}

baler:
  unsynced_baler: 11
  create_fallback_baler_no_externals: 10 # not created from external
  classify_fallback_baler: ~ # 12, used only BR-B
  create_fallback_baler_not_input_zone: 13

sync:
  time:
    branch_in:
      enabled: False
      id_reset: True
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: 2
      mismatch: 1
      stale_external_suppress_max: ~ # None → max_queue_size * 3
      min_external_interval: ~ # seconds; suspend sync if external time diff < this
      external_event_type: ~ # "id_added_imagedb_out"
      internal_event_type: ~ # "created_branch_in"
      active_target_zone: ~ # ["branch_in"]
    join_in_a:
      enabled: False
      id_reset: True
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: 5
      mismatch: 1
      stale_external_suppress_max: ~ # None → max_queue_size * 3
      external_event_type: ~ # "id_added_inspector_out_a"
      internal_event_type: ~ # "created_join_in_a"
      active_target_zone: ~ # ["join_in_a"]
      min_external_interval: ~ # seconds; suspend sync if external time diff < this
    join_in_b:
      enabled: False
      id_reset: True
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: 5
      mismatch: 1
      stale_external_suppress_max: ~ # None → max_queue_size * 3
      external_event_type: ~ # "id_added_inspector_out_b"
      internal_event_type: ~ # "created_join_in_b"
      active_target_zone: ~ # ["join_in_b"]
      min_external_interval: ~ # seconds; suspend sync if external time diff < this

  baler:
    a:
      enabled: False
      id_reset: True
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: ~
      mismatch: 1
      stale_external_suppress_max: ~ # None → max_queue_size * 3
      external_event_type: ~ # "id_added_branch_out_a"
      internal_event_type: ~ # "final_baler_house_in_a"
      active_target_zone: ~ # ["weigher_in_a"]
    b:
      enabled: False
      id_reset: True
      max_queue_size: 7
      valid_queue_size: 4
      tolerance: ~
      mismatch: 1
      stale_external_suppress_max: ~ # None → max_queue_size * 3
      external_event_type: ~ # "id_added_branch_out_b"
      internal_event_type: ~ # "final_baler_house_in_b"
      active_target_zone: ~ # ["weigher_in_b"]

resource_monitor:
  thread_interval: 3
  cpu_interval: 0.5
  cpu_threshold: 80 # %
  ram_threshold: 80 # %
  disk_threshold: 80 # %

voltage_monitor:
  logging_interval: 3
  thread_interval: 0.01
  max_queue_size: 300

cleaner:
  log:
    enabled: true
    dry_run: false # if true, no actual deletion, only "scheduled for deletion" logs are kept
    retention_hours: 720 # 30 days
    thread_interval: 3600 # 1 hour
    target_dirs: ["logs/process", "logs/monitor"]
    file_extensions: [".log"]
    remove_empty_dirs: true

  capture:
    enabled: true
    dry_run: false
    retention_hours: 72 # 3 days
    thread_interval: 3600
    target_dirs: ["captures"]
    file_extensions: [".jpg"]
    remove_empty_dirs: true

  recording:
    enabled: true
    dry_run: false
    retention_hours: 0.25  # 15 minutes
    thread_interval: 600   # 10 minutes
    target_dirs: ["results/recordings"]
    file_extensions: [".mp4", ".jpg", ".txt"]
    remove_empty_dirs: true
    
  event_image:
    enabled: true
    dry_run: false
    retention_hours: 120 # 5 days
    thread_interval: 3600
    target_dirs: ["results/event_images"]
    file_extensions: [".jpg", ".txt"]
    remove_empty_dirs: true

event_image_saver:
  enabled: false                    # 기본 비활성 (안전 우선)
  save_dir: "results/event_images"  # 저장 루트 (프로젝트 루트 상대)
  draw_bbox: false                  # bbox + 라벨 주석 포함
  draw_all_tracks: false            # 모든 활성 트랙 표시 (연회색)
  organize_by_event_type: true      # 이벤트 타입별 하위 폴더
  jpeg_quality: 100                 # JPEG 품질 (1~100)
  frame_buffer_size: 30             # ring buffer frame 수 (pre + post + 1 이상)
  pre_event_frames: 10              # 이벤트 이전 저장 frame 수
  post_event_frames: 10             # 이벤트 이후 저장 frame 수
  max_pending_events: 15            # 이후 frame 대기 중인 이벤트 최대 개수
  max_events_per_day: 100          # 하루 저장 이벤트 폴더 최대 개수 (0이면 무제한)
  enabled_event_prefixes: ~         # null -> save all events
    # weigher_in: ["001001"]        # 이벤트 타입별로 ID 접두사 필터링 (예시), null -> 모든 ID 허용
    # weigher_out: []
    # final_baler: []
    # removed: []
