  server:
      bind: "192.168.20.51"
      port: 5000
      types: ["track_event_movement"]

idmanager:
  device_fallback_id: 20
  create_retry_delay: 1.5

event_image_saver:
  enabled: true
  enabled_event_prefixes:
    created: ["002001", "002002", "004001", "004002"] # TODO: 멀티 프로필 자동 merge 기능
    removed: ~ # all

valid_time:
  branch_in:
    enabled: true
    min_create_seconds: 0
    max_create_seconds: 11

sync:
  time:
    branch_in:
      enabled: False
      external_event_type: "id_added_imagedb_out"
      internal_event_type: "created_branch_in"
      active_target_zone: ["branch_in"]

log_cleaner:
  enabled: true
  retention_days: 10

stream_queue:
  max_size:
