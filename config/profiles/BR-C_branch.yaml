  score_threshold: 0.5

ipcamera:
  url1: "rtsp://admin:dlsvmfk2849%40@192.168.20.63:554/Streaming/Channels/101"
  blank: 100
  blocked: "masks/BR-C/blocked_branch+join.png"

stream:
  exit_event_when_removed: False

