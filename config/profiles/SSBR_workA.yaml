  score_threshold: 0.5

classifier:
  model_path: "resources/classify/SSBR_work/2025-12-18_11-47-34_101_101.mp4_split-by-track/weights/best.pt"
  conf_threshold: 0.95
  class_names: [2, 1, 3] # 없는 거, 한 개 짜리, 두 개 짜리

ipcamera:
  width: 1280
  height: 720
  fps: 15
  url1: "rtsp://admin:dlsvmfk2849%40@192.168.20.21:554/Streaming/Channels/101"

gates:
  inputs: ["house_in_a"]
  outputs: ["inspector_out_a"]
  weighers: ["weigher_a"]
  classify: ["classify_a"]

network:
  notifier: { host: "192.168.20.10", port: 5000 }
  listener: { host: "192.168.20.11", port: 5000 }
  local:    { host: "192.168.20.12", port: 5000 }

valid_time:
